assert:
  - type: is-json
    metric: contract_valid
    value:
      type: object
      additionalProperties: false
      required:
        - decision
        - status
        - claims
        - confidence_basis
        - completeness
        - expected_impact
        - unresolved_evidence
        - next_action
      properties:
        decision:
          type: string
          minLength: 1
        status:
          type: string
          enum: [proceed, conditional, stop]
        claims:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [text, source_id, support]
            properties:
              text:
                type: string
                minLength: 1
              source_id:
                type: string
                minLength: 1
              support:
                type: string
                enum: [direct, inference]
        confidence_basis:
          type: string
          minLength: 1
        completeness:
          type: string
          enum: [complete, partial]
        expected_impact:
          type: string
          minLength: 1
        unresolved_evidence:
          type: array
          items:
            type: string
        next_action:
          type: string
          minLength: 1
  - type: word-count
    metric: scan_budget
    value:
      max: 115
  - type: not-contains
    metric: no_placeholder
    value: TODO
  - type: not-contains
    metric: no_placeholder
    value: TBC
  - type: not-contains
    metric: no_fabricated_certainty
    value: guaranteed
