name: MKKH LABS quality gate

on:
  pull_request:
    paths:
      - '.github/workflows/mkkh-labs-quality-gate.yml'
      - 'examples/mkkh-labs-quality-gate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mkkh-labs-quality-gate.yml'
      - 'examples/mkkh-labs-quality-gate/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkkh-labs-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pass and rejection paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MKKH_EVIDENCE_DIR: ${{ runner.temp }}/mkkh-quality-evidence
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify quality gate
        run: node examples/mkkh-labs-quality-gate/verify-gate.mjs

      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mkkh-labs-quality-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/mkkh-quality-evidence
          if-no-files-found: error
          retention-days: 14
